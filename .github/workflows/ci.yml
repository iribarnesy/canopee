name: CI

on:
  push:
    branches: [main]
  pull_request:

# La publication des pages ne vit PAS ici, et c'est délibéré : un job sauté
# reste un check sur la pull request, et « deploy — skipped » se lit comme un
# blocage alors que c'est le comportement voulu (on ne publie pas depuis une
# branche de travail). Le déploiement est donc dans `deploy.yml`, déclenché par
# la RÉUSSITE de ce workflow sur `main`. Ne pas le ramener ici.
jobs:
  # Les vérifications INSTANTANÉES, séparées des essais : elles rendent leur
  # verdict en quelques secondes, et les attendre derrière une suite de
  # trente minutes revenait à découvrir une faute de frappe une demi-heure
  # trop tard.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:boundaries
      # Le référentiel est la mémoire du projet, et un compte tenu à la main
      # diverge : l'en-tête de `realisme.md` a déjà annoncé 80/26/16 sur 122
      # quand les lignes en portaient 104/28/2 sur 134 (#76), et deux
      # divergences sont réapparues le même jour une fois la passe oubliée
      # (#111). Le script recompte depuis les lignes et vérifie que la dernière
      # entrée de la progression cite le score courant. `python3` est fourni par
      # l'image `ubuntu-latest`.
      - run: npm run check:realisme

  # LA SUITE EST DÉCOUPÉE EN SIX, et c'est du temps de mur gagné sans toucher
  # à une ligne du moteur. Mesuré : 4 368 s de travail cumulé pour 2 308 s de
  # mur, soit 1,9× de parallélisme — un runner `ubuntu-latest` a deux cœurs, et
  # vitest ne peut pas en inventer un troisième. Six machines ramènent le mur
  # au sixième.
  #
  # Depuis, les runners ont quatre cœurs virtuels et vitest y lance trois
  # ouvriers : les tranches lourdes tiennent 2,5 à 2,7 fois de parallélisme
  # (octobre 2026, #378). Et ils ne vont pas tous à la même vitesse : au même
  # moteur, les mêmes fichiers d'une tranche ont pris ensemble 1,7 à 2,0 fois
  # leur temps d'une course à l'autre, ceux d'une autre tranche deux fois
  # moins. Un délai se dimensionne sur plusieurs courses, pas sur une.
  #
  # `--shard` répartit les FICHIERS, pas les essais : chaque tranche est une
  # suite complète et autonome, et le découpage ne change donc rien à ce qui
  # est vérifié. Si une tranche rougit, son journal porte l'échec entier.
  #
  # Il les répartit en nombre, pas en durée : trié par empreinte du chemin,
  # coupé en parts égales. En octobre 2026, la tranche 2 tient en 6 min et la
  # 5 en 28. Chaque fichier ajouté déplace jusqu'à cinq fichiers d'une tranche
  # à la suivante.
  #
  # LE PLANCHER EST LE FICHIER LE PLUS LOURD, et c'est pour ça que les essais
  # de hauteur ont été coupés en deux (700 s à eux seuls, 16 % de la suite) :
  # aucun nombre de tranches ne pouvait passer sous un fichier indivisible. Le
  # plancher est remonté à ~840 s (`naivete-vent`), mais une tranche est bornée
  # par son travail total bien avant de l'être par lui. Avant d'ajouter des
  # tranches, vérifier que ce n'est pas un fichier qui borne, sinon on paie des
  # machines pour rien.
  #
  # Pour changer le nombre : allonger `tranche` ET le dénominateur. Les deux
  # doivent rester d'accord, sinon des fichiers ne sont tournés par personne.
  essais:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tranche: [1, 2, 3, 4, 5, 6]
    name: essais (${{ matrix.tranche }}/6)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.tranche }}/6
